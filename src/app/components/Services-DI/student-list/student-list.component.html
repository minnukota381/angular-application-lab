<div class="student-list">
  <h2>Student List</h2>
  <ul *ngIf="students && students.length > 0">
    <li *ngFor="let student of students">
      {{ student.name }} (ID: {{ student.id }})
    </li>
  </ul>
  <p *ngIf="students && students.length === 0">No students found.</p>
  <p *ngIf="!students">Loading...</p>
</div>
